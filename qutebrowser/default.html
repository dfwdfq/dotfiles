<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qutebrowser: welcome buffer</title>

  <style>
    :root {
      --background: #120c1f;
      --surface: #211436;
      --surface-hover: #2d1b49;
      --border: #49316b;
      --text: #f1eaff;
      --muted: #b9a8d3;
      --accent: #c084fc;
      --accent-bright: #e0b3ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      align-items: center;
      background:
        radial-gradient(
          circle at top left,
          #382358 0,
          transparent 38%
        ),
        radial-gradient(
          circle at bottom right,
          #281640 0,
          transparent 42%
        ),
        var(--background);
      color: var(--text);
      display: flex;
      font-family: system-ui, -apple-system, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
    }

    main {
      padding: 32px 20px;
      text-align: center;
      width: min(760px, 100%);
    }

    h1 {
      color: var(--accent-bright);
      font-size: clamp(2rem, 5vw, 3.5rem);
      margin: 0 0 8px;
    }

    .subtitle {
      color: var(--muted);
      margin: 0 0 32px;
    }

    .search {
      display: flex;
      margin: 0 auto 36px;
      max-width: 620px;
    }

    .search input {
      background: rgba(33, 20, 54, 0.9);
      border: 1px solid var(--border);
      border-radius: 10px 0 0 10px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      padding: 14px 16px;
      width: 100%;
    }

    .search input::placeholder {
      color: var(--muted);
    }

    .search input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(192, 132, 252, 0.15);
    }

    .search button {
      background: var(--accent);
      border: 0;
      border-radius: 0 10px 10px 0;
      color: #1b0d2c;
      cursor: pointer;
      font-weight: 700;
      padding: 0 20px;
    }

    .search button:hover {
      background: var(--accent-bright);
    }

    .link-grid {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(
        auto-fit,
        minmax(150px, 1fr)
      );
    }

    .link-cell {
      align-items: center;
      background: rgba(33, 20, 54, 0.88);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      display: flex;
      font-size: 1.1rem;
      font-weight: 600;
      justify-content: center;
      min-height: 120px;
      padding: 20px;
      text-decoration: none;
      transition:
        background 150ms ease,
        border-color 150ms ease,
        box-shadow 150ms ease,
        transform 150ms ease;
    }

    .link-cell:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
      color: var(--accent-bright);
      transform: translateY(-4px);
    }

    .link-cell:focus-visible {
      border-color: var(--accent-bright);
      outline: 3px solid rgba(224, 179, 255, 0.35);
      outline-offset: 3px;
    }

    footer {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 32px;
    }
  </style>
</head>

<body>
  <main>
    <h1>Quick access</h1>

    <section class="link-grid" aria-label="Favorite websites">
      <a
        class="link-cell"
        href="https://duckduckgo.com/"
      >
        DuckDuckGo
      </a>

      <a
        class="link-cell"
        href="https://github.com/"
      >
        GitHub
      </a>

      <a
        class="link-cell"
        href="https://codeberg.org/"
      >
        Codeberg
      </a>

      <a
        class="link-cell"
        href="https://www.reddit.com/"
      >
        Reddit
      </a>

      <a
        class="link-cell"
        href="https://mail.yandex.com/"
      >
        Yandex Mail
      </a>
    </section>
  </main>
</body>
</html>
